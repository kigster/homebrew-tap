name: update-svg2og

# Refresh Formula/svg2og.rb (version + per-arch sha256) from a published
# svg2og release. Triggered automatically by that repo's release
# workflow (repository_dispatch) or manually with a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "svg2og release tag to track (e.g. v0.1.0)"
        required: true
  repository_dispatch:
    types: [svg2og-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Regenerate formula from release assets
        env:
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          : "${TAG:?a tag is required}"
          # TAG can come from a repository_dispatch client_payload
          # (attacker-influenced) and is interpolated into URLs and the
          # generated formula, so validate hard.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "Refusing to run for suspicious tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          base="https://github.com/kigster/svg2og/releases/download/${TAG}"

          sha() { curl -fsSL "$1" | shasum -a 256 | awk '{print $1}'; }
          MAC_ARM=$(sha "$base/svg2og-aarch64-apple-darwin.tar.gz")
          MAC_INTEL=$(sha "$base/svg2og-x86_64-apple-darwin.tar.gz")

          mkdir -p Formula
          cat > Formula/svg2og.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Generated by .github/workflows/update-svg2og.yml — do not edit by hand.
          class Svg2og < Formula
            desc "Convert Mermaid SVG exports for clean import into OmniGraffle"
            homepage "https://github.com/kigster/svg2og"
            version "${VERSION}"
            license "MIT"

            depends_on :macos

            on_macos do
              on_arm do
                url "${base}/svg2og-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "${base}/svg2og-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_INTEL}"
              end
            end

            def install
              bin.install "svg2og"
            end

            test do
              assert_match "svg2og #{version}", shell_output("#{bin}/svg2og --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/svg2og.rb
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Update svg2og formula for ${TAG}"
          git push
        env:
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}